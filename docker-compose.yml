services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate tally_test database used by the test suite.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tally:tally@db:5432/tally
      MAX_UPLOAD_BYTES: 10485760
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # One-command test run: docker compose run --rm --build test
  test:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://tally:tally@db:5432/tally_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
